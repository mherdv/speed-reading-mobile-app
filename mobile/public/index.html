<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta
      name="description"
      content="Reading-first practice for pace, comprehension, evidence, vocabulary, and focused scanning."
    />
    <meta name="application-name" content="SpeedRead" />
    <meta name="theme-color" content="#0E4979" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SpeedRead" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        margin: 0;
        background: #0e4979;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      body.app-ready {
        background: #f6fafc;
      }
      .app-boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0e4979;
      }
      .app-boot img {
        width: min(78vw, 340px);
        height: auto;
      }
      @media (prefers-reduced-motion: no-preference) {
        .app-boot img {
          animation: app-boot-breathe 1.6s ease-in-out infinite alternate;
        }
      }
      @keyframes app-boot-breathe {
        from {
          opacity: 0.88;
          transform: scale(0.985);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div
      id="app-loading"
      class="app-boot"
      role="status"
      aria-label="Loading SpeedRead"
    >
      <img src="./launch-logo.svg" alt="" />
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var root = document.getElementById('root');
        var loader = document.getElementById('app-loading');
        if (!root || !loader) return;
        var observer = new MutationObserver(function () {
          if (root.childElementCount === 0) return;
          document.body.classList.add('app-ready');
          loader.remove();
          observer.disconnect();
        });
        observer.observe(root, { childList: true });
      })();

      if (
        'serviceWorker' in navigator &&
        (window.location.protocol === 'https:' || window.location.hostname === 'localhost')
      ) {
        document.documentElement.dataset.pwaStatus = 'registering';
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('./sw.js')
            .then(function () {
              return navigator.serviceWorker.ready;
            })
            .then(function () {
              document.documentElement.dataset.pwaStatus = 'ready';
            })
            .catch(function (error) {
              document.documentElement.dataset.pwaStatus = 'failed';
              console.warn('SpeedRead offline setup was not available:', error);
            });
        });
      } else {
        document.documentElement.dataset.pwaStatus =
          window.location.protocol === 'https:' || window.location.hostname === 'localhost'
            ? 'unsupported'
            : 'requires-https';
      }
    </script>
  </body>
</html>
